[general]
import = ["~/.config/alacritty/tokyonight_moon.toml"]

[env]
TERM = "xterm-256color"

[terminal]
osc52 = "CopyPaste"
shell = { program = "/usr/bin/zellij" }

[font]
normal = { family = "FiraCode Nerd Font", style = "Regular" }
bold = { family = "FiraCode Nerd Font", style = "Bold" }
italic = { family = "FiraCode Nerd Font", style = "Italic" }
bold_italic = { family = "FiraCode Nerd Font", style = "Bold Italic" }
size = 11

[window]
padding = { x = 14, y = 14 }
dynamic_padding = false
decorations = "Full"
opacity = 1.0

[colors.cursor]
text = "#222436"
cursor = "#c8d3f5"

[colors.selection]
text = "#c8d3f5"
background = "#2d3f76"

[[keyboard.bindings]]
key = "Insert"
mods = "Shift"
action = "Paste"

[[keyboard.bindings]]
key = "Insert"
mods = "Control"
action = "Copy"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B[13;2u"

[[keyboard.bindings]]
key = "Return"
mods = "Alt|Shift"
chars = "\u001B[13;4u"
